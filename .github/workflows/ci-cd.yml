name: Python CI/CD test 
on:
   workflow_dispatch: 
   push:
      #branches:
      #-main
   pull_request:
      branches:
       -main

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
             python-version: '3.12'
        - name: Install dependencies
          run:  pip install -r requirements.txt
        - name: Run tests
          run: pytest
          env:
              PYTHONPATH: .
    package:
        needs: test
        runs-on: ubuntu-latest

        steps:
              - name: Checkout code
                uses: actions/checkout@v4
              - name: create package
                run: zip -r python-app.zip src tests requirements.txt
              - name: Upload package
                uses: actions/upload-artifact@v4
                with:
                  name: python-app
                  path: python-app.zip








